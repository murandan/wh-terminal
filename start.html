<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Установка Trade Control</title>
    <style>
        body { 
            background-color: #1a1a1a; 
            color: white; 
            font-family: sans-serif; 
            text-align: center; 
            padding: 50px 20px; 
        }
        .btn { 
            display: inline-block; 
            background: #3498db; 
            color: white; 
            padding: 18px 35px; 
            text-decoration: none; 
            border-radius: 8px; 
            font-weight: bold; 
            margin-top: 30px; 
            font-size: 18px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        #ios-hint {
            display: none;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            font-size: 16px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <h2 id="main-title">Подготовка к запуску</h2>
    <p id="main-desc" style="color: #cccccc;">Для правильной установки кассы и успешной авторизации, нажмите кнопку ниже:</p>
    
    <a id="start-btn" class="btn" href="#">ЗАПУСТИТЬ КАССУ</a>
    
    <div id="ios-hint">
        <p style="font-size: 40px; margin: 0 0 10px 0;">🧭</p>
        <p>Чтобы установить кассу на iPhone, нажмите на <b>значок компаса (или глобуса)</b> в правом нижнем углу экрана.</p>
        <p style="color: #aaaaaa; font-size: 14px; margin-top: 15px;">Приложение откроется в браузере Safari.</p>
    </div>

    <script>
        var btn = document.getElementById('start-btn');
        var desc = document.getElementById('main-desc');
        var title = document.getElementById('main-title');
        var iosHint = document.getElementById('ios-hint');
        
        if (/Android/i.test(navigator.userAgent)) {
            // Для Android показываем кнопку и прописываем intent-переход
            btn.href = "intent://web-kassa-old.github.io/app/#Intent;scheme=https;package=com.android.chrome;end";
        } else if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
            // Для iOS ПРЯЧЕМ кнопку и показываем блок с компасом
            btn.style.display = "none";
            desc.style.display = "none";
            title.innerText = "Почти готово!";
            iosHint.style.display = "block";
        } else {
            // Для ПК оставляем кнопку с обычной ссылкой
            btn.href = "https://web-kassa-old.github.io/app/";
        }
    </script>
</body>
</html>
