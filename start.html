<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Установка Trade Control</title>
    <style>
        body { 
            background-color: #1a1a1a; 
            color: white; 
            font-family: sans-serif; 
            text-align: center; 
            padding: 50px 20px; 
        }
        .btn { 
            display: none; /* Изначально прячем кнопку от всех */
            background: #3498db; 
            color: white; 
            padding: 18px 35px; 
            text-decoration: none; 
            border-radius: 8px; 
            font-weight: bold; 
            margin-top: 20px; 
            font-size: 18px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        #ios-hint {
            display: none;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 30px 20px;
            border-radius: 12px;
            margin-top: 20px;
            font-size: 16px;
            line-height: 1.5;
        }
        #status-text {
            color: #cccccc;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <h2 id="main-title">Проверка браузера...</h2>
    <p id="status-text">Пожалуйста, подождите.</p>
    
    <a id="start-btn" class="btn" href="#">ОТКРЫТЬ TRADE CONTROL</a>
    
    <!-- Блок-заглушка для iOS внутри Telegram -->
    <div id="ios-hint">
        <p style="font-size: 50px; margin: 0 0 15px 0;">🧭</p>
        <p style="font-size: 18px;"><b>Шаг 1 из 2</b></p>
        <p>Чтобы продолжить установку, нажмите на <b>значок компаса</b> в правом нижнем углу экрана.</p>
    </div>

    <script>
        var btn = document.getElementById('start-btn');
        var iosHint = document.getElementById('ios-hint');
        var title = document.getElementById('main-title');
        var statusText = document.getElementById('status-text');
        
        var ua = navigator.userAgent;
        var isIOS = /iPhone|iPad|iPod/i.test(ua);
        var isAndroid = /Android/i.test(ua);
        
        // Магия определения: если это iOS, но в данных нет слова Safari — значит мы в Telegram/WhatsApp
        var isIOSWebView = isIOS && !/Safari/i.test(ua); 

        if (isAndroid) {
            // Сценарий 1: Это Android. Показываем кнопку для авто-запуска Chrome
            title.innerText = "Подготовка к запуску";
            statusText.innerText = "Нажмите кнопку ниже, чтобы открыть терминал.";
            btn.style.display = "inline-block";
            btn.href = "intent://web-kassa-old.github.io/app/#Intent;scheme=https;package=com.android.chrome;end";
            
        } else if (isIOSWebView) {
            // Сценарий 2: Это iPhone, и он застрял в Telegram. Прячем всё, показываем компас.
            title.innerText = "Внимание!";
            statusText.style.display = "none";
            iosHint.style.display = "block";
            
        } else {
            // Сценарий 3: Это iPhone (уже внутри Safari) или компьютер. Показываем кнопку.
            title.innerText = "Всё готово!";
            statusText.innerText = "Теперь вы находитесь в правильном браузере. Можно запускать!";
            btn.style.display = "inline-block";
            btn.href = "https://web-kassa-old.github.io/app/";
        }
    </script>
</body>
</html>
