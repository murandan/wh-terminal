<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка Trade Control...</title>
</head>
<body style="background-color: #1a1a1a; color: white; font-family: sans-serif; text-align: center; padding-top: 50px;">
    <h2>Подготовка к установке...</h2>
    
    <script>
        // Проверяем устройство пользователя
        if (/Android/i.test(navigator.userAgent)) {
            // Если это Android, принудительно открываем чистый Google Chrome через 0.5 сек
            setTimeout(function() {
                window.location.href = "intent://web-kassa-old.github.io/app/#Intent;scheme=https;package=com.android.chrome;end";
            }, 500);
        } else {
            // Если это iPhone, iPad или ПК — сразу кидаем на обычную прямую ссылку
            window.location.href = "https://web-kassa-old.github.io/app/";
        }
    </script>
</body>
</html>
